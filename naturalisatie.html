<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Naturalisatie Checker — Solidari</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Source+Sans+3:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="components.css">
  <link rel="stylesheet" href="spraak.css">
  <script src="naturalisatie-data.js"></script>
  <style>
    :root { --paars: #7C3AED; --rood: #DC2626; --rood-licht: #FEF2F2; --blauw: #2563EB; --blauw-licht: #EFF6FF; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { background: var(--wit); color: var(--tekst); font-family: 'Source Sans 3', sans-serif; font-weight: 400; line-height: 1.6; min-height: 100vh; }
    .pagina-header { padding-top: 64px; background: var(--groen); color: white; position: relative; overflow: hidden; }
    .pagina-header::before { content: '🇳🇱'; position: absolute; right: 8%; top: 50%; transform: translateY(-50%); font-size: 7rem; opacity: 0.07; pointer-events: none; }
    .pagina-header::after { content: ''; position: absolute; right: -80px; top: -80px; width: 320px; height: 320px; border-radius: 50%; background: rgba(232,160,32,0.08); }
    .header-inhoud { max-width: 720px; margin: 0 auto; padding: 3rem 2rem 2.5rem; position: relative; z-index: 1; }
    .header-badge { display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,0.12); border-radius: 20px; padding: 4px 12px; font-size: 0.75rem; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; margin-bottom: 1rem; opacity: 0.85; }
    .header-titel { font-family: 'Playfair Display', serif; font-size: 2.2rem; font-weight: 700; line-height: 1.2; margin-bottom: 0.6rem; }
    .header-sub { font-size: 1rem; opacity: 0.75; font-weight: 300; max-width: 480px; line-height: 1.7; }
    .voortgang-balk { background: rgba(255,255,255,0.08); height: 4px; }
    .voortgang-balk-vulling { height: 100%; background: var(--amber); transition: width 0.5s ease; }
    .hoofd { max-width: 720px; margin: 0 auto; padding: 2.5rem 2rem 4rem; }
    .vraag-kaart { background: white; border: 1px solid var(--rand); border-radius: 20px; overflow: hidden; margin-bottom: 1.5rem; animation: inschuiven 0.4s ease both; }
    @keyframes inschuiven { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    .vraag-header { padding: 1.5rem 1.8rem 1.2rem; border-bottom: 1px solid var(--rand); }
    .vraag-stap { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--amber-diep); margin-bottom: 0.5rem; }
    .vraag-tekst { font-family: 'Playfair Display', serif; font-size: 1.25rem; font-weight: 600; color: var(--tekst); line-height: 1.3; }
    .vraag-uitleg { font-size: 0.82rem; color: var(--tekst-licht); margin-top: 6px; font-weight: 300; line-height: 1.6; }
    .antwoorden { padding: 1.2rem 1.8rem 1.5rem; display: flex; flex-direction: column; gap: 10px; }
    .antwoord-knop { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border: 1.5px solid var(--rand); border-radius: 12px; background: var(--wit); cursor: pointer; text-align: left; font-family: 'Source Sans 3', sans-serif; font-size: 0.9rem; color: var(--tekst); transition: all 0.2s; width: 100%; }
    .antwoord-knop:hover { border-color: var(--groen); background: var(--groen-licht); transform: translateX(4px); }
    .antwoord-knop.nee:hover { border-color: var(--rood); background: var(--rood-licht); }
    .antwoord-knop.anders:hover { border-color: var(--amber); background: var(--amber-licht); }
    .antwoord-knop.info:hover { border-color: var(--blauw); background: var(--blauw-licht); }
    .antwoord-icoon { width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 0.95rem; flex-shrink: 0; }
    .antwoord-tekst { font-weight: 500; line-height: 1.3; }
    .antwoord-sub { font-size: 0.78rem; color: var(--tekst-licht); font-weight: 300; margin-top: 2px; }
    .geschiedenis-item { background: var(--wit-warm); border: 1px solid var(--rand); border-radius: 14px; padding: 0.9rem 1.4rem; margin-bottom: 0.7rem; display: flex; align-items: center; justify-content: space-between; gap: 12px; opacity: 0.75; }
    .geschiedenis-vraag { font-size: 0.82rem; color: var(--tekst-zacht); flex: 1; }
    .geschiedenis-antwoord { font-size: 0.8rem; font-weight: 600; padding: 3px 10px; border-radius: 6px; flex-shrink: 0; white-space: nowrap; }
    .ga-ja { background: var(--groen-licht); color: var(--groen); }
    .ga-nee { background: var(--rood-licht); color: var(--rood); }
    .ga-anders { background: var(--amber-licht); color: var(--amber-diep); }
    .ga-info { background: var(--blauw-licht); color: var(--blauw); }
    .resultaat-kaart { border-radius: 20px; overflow: hidden; animation: inschuiven 0.5s ease both; }
    .resultaat-header { padding: 2rem 2rem 1.5rem; color: white; }
    .resultaat-icoon-groot { font-size: 2.5rem; margin-bottom: 0.8rem; }
    .resultaat-titel { font-family: 'Playfair Display', serif; font-size: 1.6rem; font-weight: 700; line-height: 1.2; margin-bottom: 0.5rem; }
    .resultaat-sub { font-size: 0.9rem; opacity: 0.85; font-weight: 300; line-height: 1.6; }
    .resultaat-body { background: white; padding: 1.5rem 2rem 2rem; border: 1px solid var(--rand); border-top: none; border-radius: 0 0 20px 20px; }
    .resultaat-positief .resultaat-header { background: var(--groen); }
    .resultaat-negatief .resultaat-header { background: #374151; }
    .resultaat-wacht .resultaat-header { background: var(--amber-diep); }
    .resultaat-route .resultaat-header { background: var(--paars); }
    .resultaat-eu .resultaat-header { background: #1e40af; }
    .stap-lijst { list-style: none; display: flex; flex-direction: column; gap: 10px; margin-bottom: 1.5rem; }
    .stap-item-res { display: flex; gap: 12px; align-items: flex-start; }
    .stap-nr-res { width: 24px; height: 24px; border-radius: 50%; background: var(--groen); color: white; font-size: 0.7rem; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px; }
    .stap-tekst-res { font-size: 0.85rem; color: var(--tekst-zacht); line-height: 1.5; }
    .stap-tekst-res strong { color: var(--tekst); }
    .route-paden { display: flex; flex-direction: column; gap: 12px; margin-bottom: 1.5rem; }
    .route-pad { border: 1.5px solid var(--rand); border-radius: 12px; padding: 14px 16px; background: var(--wit-warm); }
    .route-pad-header { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
    .route-pad-nr { width: 28px; height: 28px; border-radius: 8px; background: var(--paars); color: white; font-size: 0.75rem; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .route-pad-titel { font-weight: 600; font-size: 0.9rem; color: var(--tekst); }
    .route-pad-tekst { font-size: 0.8rem; color: var(--tekst-zacht); line-height: 1.5; padding-left: 38px; }
    .alternatief-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 1.5rem; }
    .alternatief-item { background: var(--wit-warm); border: 1px solid var(--rand); border-radius: 10px; padding: 12px; }
    .alternatief-naam { font-size: 0.82rem; font-weight: 600; color: var(--tekst); margin-bottom: 3px; }
    .alternatief-tekst { font-size: 0.75rem; color: var(--tekst-zacht); font-weight: 300; line-height: 1.4; }
    .info-box { background: var(--blauw-licht); border-left: 3px solid var(--blauw); border-radius: 0 8px 8px 0; padding: 10px 14px; margin-bottom: 1rem; font-size: 0.82rem; color: var(--tekst-zacht); line-height: 1.5; }
    .amber-box { background: var(--amber-licht); border-left: 3px solid var(--amber); border-radius: 0 8px 8px 0; padding: 10px 14px; margin-bottom: 1rem; font-size: 0.82rem; color: var(--tekst-zacht); line-height: 1.5; }
    .sectie-label { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--tekst-licht); margin-bottom: 0.6rem; }
    .actie-knoppen { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 1.5rem; }
    .knop-primair { background: var(--groen); color: white; border: none; border-radius: 8px; padding: 11px 22px; font-size: 0.9rem; font-weight: 600; cursor: pointer; text-decoration: none; font-family: 'Source Sans 3', sans-serif; transition: all 0.2s; display: inline-block; }
    .knop-primair:hover { background: #234830; }
    .knop-secundair { background: transparent; color: var(--tekst); border: 1.5px solid var(--rand); border-radius: 8px; padding: 11px 22px; font-size: 0.9rem; font-weight: 500; cursor: pointer; font-family: 'Source Sans 3', sans-serif; transition: all 0.2s; }
    .knop-secundair:hover { border-color: var(--tekst-zacht); }
    .disclaimer { margin-top: 1.5rem; padding: 1rem 1.2rem; background: var(--wit-warm); border-radius: 10px; font-size: 0.75rem; color: var(--tekst-licht); line-height: 1.6; }
    @media (max-width: 600px) { .header-titel { font-size: 1.7rem; } .alternatief-grid { grid-template-columns: 1fr; } .antwoorden { padding: 1rem 1.2rem 1.2rem; } .vraag-header { padding: 1.2rem 1.2rem 1rem; } .resultaat-body { padding: 1.2rem 1.2rem 1.5rem; } }
  </style>
</head>
<body>
<div id="solidari-nav"></div>
<div class="pagina-header">
  <div class="header-inhoud">
    <div class="header-badge">🇳🇱 Naturalisatie Checker</div>
    <h1 class="header-titel">Kom ik in aanmerking voor een Nederlands paspoort?</h1>
    <p class="header-sub">Beantwoord een paar vragen en zie direct of je naturalisatie kunt aanvragen — op basis van de IND-voorwaarden van 2026, inclusief de nieuwe asielregels.</p>
  </div>
  <div class="voortgang-balk">
    <div class="voortgang-balk-vulling" id="voortgang" style="width:0%"></div>
  </div>
</div>
<div class="hoofd" id="hoofd"></div>

<script>
// ── Taal-helpers ─────────────────────────────────────────────────────────
function huidigeTaal() {
  const code = (localStorage.getItem('solidari-taal') || 'nl').toUpperCase();
  return window._NAT && window._NAT[code] ? code : 'NL';
}

function getNATdata() {
  if (!window._NAT) return null;
  return window._NAT[huidigeTaal()] || window._NAT['NL'];
}

// Update de statische header bij taalwissel
function updateHeader() {
  const nat = getNATdata();
  if (!nat) return;
  const h = nat.header;
  const taal = huidigeTaal();
  const rtl = taal === 'AR' || taal === 'FA';
  document.documentElement.setAttribute('dir', rtl ? 'rtl' : 'ltr');
  document.documentElement.setAttribute('lang', taal.toLowerCase());
  const badgeEl = document.querySelector('.header-badge');
  const titelEl = document.querySelector('.header-titel');
  const subEl   = document.querySelector('.header-sub');
  if (badgeEl) badgeEl.textContent = h.badge;
  if (titelEl) titelEl.textContent = h.titel;
  if (subEl)   subEl.textContent   = h.sub;
}

// ── Voorleeshulp (N-6): tekst zonder HTML, en veilig in een attribuut ────
function naarPlatteTekst(html) {
  const tmp = document.createElement('div');
  tmp.innerHTML = html == null ? '' : String(html);
  return (tmp.textContent || '').replace(/\s+/g, ' ').trim();
}
function escAttr(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/"/g, '&quot;')
    .replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
// data-lees voor een vraag: de vraagtekst + "je kunt kiezen:" + elk getoond antwoord.
// Correctie 1, §3.1.4: alleen de getoonde (niet door alleenPad weggefilterde) antwoorden.
function bouwVraagLees(v, ui, antwoordenGetoond) {
  const stukken = [naarPlatteTekst(v.tekst) + '.'];
  if (ui.jeKuntKiezen) stukken.push(ui.jeKuntKiezen);
  (antwoordenGetoond || []).forEach(a => stukken.push(naarPlatteTekst(a.tekst) + '.'));
  return escAttr(stukken.join(' '));
}

// ── Correctie 1, §3.1: route (`pad`) en `alleenPad`/`infoAlleenPad` ───────
// Het huidige pad is het `pad` van het laatst gekozen antwoord in `geschiedenis`
// dat er één heeft. "Opnieuw beginnen" wist `geschiedenis` en dus het pad.
// Terug via v_asiel_wn → v1b mag het pad opnieuw zetten: dat gebeurt vanzelf
// zodra daarna weer een antwoord met `pad` wordt gekozen.
function huidigPad() {
  for (let i = geschiedenis.length - 1; i >= 0; i--) {
    if (geschiedenis[i].pad) return geschiedenis[i].pad;
  }
  return null;
}
// Zonder `alleenPad` altijd tonen. Met `alleenPad`: alleen tonen als het gelijk
// is aan het huidige pad. Zonder huidig pad (null) worden elementen met
// `alleenPad` dus NIET getoond (§3.1.2).
function padOk(alleenPad, pad) {
  return !alleenPad || alleenPad === pad;
}
function filterPad(lijst, pad) {
  return (lijst || []).filter(el => padOk(el.alleenPad, pad));
}
// §3.1.5: stapnummers van gefilterde stappen opnieuw doornummeren.
function hernummerStappen(stappen) {
  return (stappen || []).map((s, i) => Object.assign({}, s, { nr: i + 1 }));
}

// ── Voortgang (N-5): "Vraag {n}" + balk op basis van het langste resterende pad ──
// Cycli-veilig: de enige toegestane cyclus is v_asiel_wn → v1b (fase 3, check.js).
// Een node die al in het huidige pad staat levert 0 extra stappen op (geen oneindige lus).
function langsteRest(id, vragenMap, resultatenMap, bezoek) {
  if (resultatenMap[id]) return 0;
  const v = vragenMap[id];
  if (!v) return 0;
  bezoek = bezoek || new Set();
  if (bezoek.has(id)) return 0;
  const volgendeBezoek = new Set(bezoek);
  volgendeBezoek.add(id);
  let max = 0;
  (v.antwoorden || []).forEach(a => {
    const rest = 1 + langsteRest(a.volgende, vragenMap, resultatenMap, volgendeBezoek);
    if (rest > max) max = rest;
  });
  return max;
}

// F-6: geen _NAT beschikbaar → één foutmelding, geen stille lege pagina.
function toonLaadfout() {
  const hoofd = document.getElementById('hoofd');
  const natNL = window._NAT && window._NAT.NL;
  const tekst = (natNL && natNL.ui && natNL.ui.ladenMislukt)
    || 'Er ging iets mis bij het laden van deze pagina. Vernieuw de pagina of probeer het later opnieuw.';
  hoofd.innerHTML = `<div class="vraag-kaart"><div class="vraag-header">
    <div class="vraag-tekst" data-lees="${escAttr(tekst)}">${tekst}</div>
  </div></div>`;
}

// Luister naar taalwisselingen vanuit components.js
document.addEventListener('solidari:taalGewijzigd', function() {
  updateHeader();
  geschiedenis = [];
  huidigVraagId = 'v1';
  document.getElementById('voortgang').style.width = '0%';
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

// Hook voor components.js taalwisselaar
window.setTaal = function() {
  document.dispatchEvent(new CustomEvent('solidari:taalGewijzigd'));
};

let geschiedenis = [];
let huidigVraagId = 'v1';

function render() {
  const hoofd = document.getElementById('hoofd');
  if (!window._NAT) { toonLaadfout(); return; }
  hoofd.innerHTML = '';
  geschiedenis.forEach(item => {
    const el = document.createElement('div');
    el.className = 'geschiedenis-item';
    const kl = item.klasse === 'ja' ? 'ga-ja' : item.klasse === 'nee' ? 'ga-nee' : item.klasse === 'info' ? 'ga-info' : 'ga-anders';
    el.innerHTML = `<span class="geschiedenis-vraag">${item.vraagTekst}</span><span class="geschiedenis-antwoord ${kl}">${item.antwoordTekst}</span>`;
    hoofd.appendChild(el);
  });
  if (huidigVraagId.startsWith('r_')) toonResultaat(huidigVraagId);
  else toonVraag(huidigVraagId);
  if (geschiedenis.length > 0) setTimeout(() => hoofd.lastElementChild?.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 100);
}

// F-8/N-5: geen vaste "Stap X van 9" meer. Label = ui.vraagLabel met n =
// geschiedenis.length + 1. Voortgang = n / (n + langsteRest(id)).
function toonVraag(id) {
  const nat = getNATdata();
  if (!nat) { toonLaadfout(); return; }
  const ui = nat.ui || {};
  const v = nat.vragen[id]; if (!v) return;
  const pad = huidigPad();
  // §3.1.3: kiesAntwoord gebruikt de oorspronkelijke index, dus eerst indexeren
  // en pas daarna filteren op `alleenPad`.
  const getoond = (v.antwoorden || [])
    .map((a, i) => ({ a, i }))
    .filter(({ a }) => padOk(a.alleenPad, pad));
  const n = geschiedenis.length + 1;
  const rest = langsteRest(id, nat.vragen, nat.resultaten);
  const voortgangPct = Math.round((n / (n + rest)) * 100);
  document.getElementById('voortgang').style.width = voortgangPct + '%';
  const label = (ui.vraagLabel || 'Vraag {n}').replace('{n}', n);
  const leesAttr = bouwVraagLees(v, ui, getoond.map(({ a }) => a));
  const kaart = document.createElement('div');
  kaart.className = 'vraag-kaart';
  kaart.innerHTML = `
    <div class="vraag-header">
      <div class="vraag-stap">${label}</div>
      <div class="vraag-tekst" data-lees="${leesAttr}">${v.tekst}</div>
      ${v.uitleg ? `<div class="vraag-uitleg" data-lees="">${v.uitleg}</div>` : ''}
    </div>
    <div class="antwoorden">
      ${getoond.map(({ a, i }) => `
        <button class="antwoord-knop ${a.klasse||''}" onclick="kiesAntwoord('${id}',${i})">
          <div class="antwoord-icoon" style="background:${a.klasse==='ja'?'var(--groen-licht)':a.klasse==='nee'?'var(--rood-licht)':a.klasse==='info'?'var(--blauw-licht)':'var(--amber-licht)'}">
            ${a.icoon}
          </div>
          <div>
            <div class="antwoord-tekst">${a.tekst}</div>
            ${a.sub?`<div class="antwoord-sub">${a.sub}</div>`:''}
          </div>
        </button>`).join('')}
    </div>`;
  document.getElementById('hoofd').appendChild(kaart);
  if (geschiedenis.length > 0) {
    const opnieuw = document.createElement('div');
    opnieuw.style.cssText = 'text-align:center;margin-top:0.5rem;';
    opnieuw.innerHTML = `<button class="knop-secundair" onclick="opnieuwBeginnen()" style="font-size:0.8rem;padding:7px 16px;">${ui.opnieuw || '↺'}</button>`;
    document.getElementById('hoofd').appendChild(opnieuw);
  }
}

function toonResultaat(id) {
  const nat = getNATdata();
  if (!nat) { toonLaadfout(); return; }
  const ui = nat.ui || {};
  const res = nat.resultaten[id]; if (!res) return;
  const pad = huidigPad();
  document.getElementById('voortgang').style.width = '100%';
  const kaart = document.createElement('div');
  kaart.className = `resultaat-kaart resultaat-${res.type}`;
  // Bugfix (gevonden bij F-7): disclaimer/vwnTekst/vwnLabel staan onder
  // nat.header.*, niet op nat zelf — anders viel elke taal terug op de
  // Nederlandse/Engelse vaste tekst hieronder.
  const h = nat.header || {};
  // Correctie 1, §3.1.6: op pad "regulier" toont het hulpblok het Juridisch
  // Loket (header.hulpRegulierLabel/-Tekst) i.p.v. het VWN-blok. Dat geldt
  // overal waar het VWN-blok stond: de disclaimerregel, de extra stap van
  // r_positief, en het amber-blok bij de alternatieven-resultaten.
  const hulpTekst = pad === 'regulier' ? (h.hulpRegulierTekst || '') : (h.vwnTekst || '');
  const hulpLabel = pad === 'regulier' ? (h.hulpRegulierLabel || '') : (h.vwnLabel || '');
  const disclaimerTekst = h.disclaimer || '';
  const disclaimer = `<div class="disclaimer" data-lees="">${disclaimerTekst}${hulpTekst ? `<br><br>💬 ${hulpTekst}` : ''}</div>`;
  const interneBtn = res.interneLink ? `<button class="knop-primair" style="background:var(--blauw);" onclick="gaNaarResultaat('${res.interneLink.naar}')">${res.interneLink.tekst}</button>` : '';
  // N-10: alleen externe (http…) links openen in een nieuw tabblad.
  const isExtern = res.link && /^https?:\/\//i.test(res.link);
  const externeBtn = res.link ? `<a href="${res.link}"${isExtern ? ' target="_blank"' : ''} class="${res.interneLink ? 'knop-secundair' : 'knop-primair'}">${res.linkTekst||''}</a>` : '';
  const knoppen = `<div class="actie-knoppen">${interneBtn}${externeBtn}<button class="knop-secundair" onclick="opnieuwBeginnen()">${ui.opnieuw || '↺'}</button></div>`;
  const vwnBox = hulpTekst ? `<div class="amber-box" style="margin-top:1rem;" data-lees="">💬 ${hulpLabel ? `<strong>${hulpLabel}</strong> ` : ''}${hulpTekst}</div>` : '';
  // Correctie 1, §3.1.2: het losse `info`-veld (bijv. r_positief.info) volgt
  // `infoAlleenPad`, net als `alleenPad` bij infoBoxen/alternatieven/stappen.
  const infoGetoond = padOk(res.infoAlleenPad, pad) ? res.info : '';
  let body = '';
  if (res.type === 'positief') {
    const stappenGetoond = hernummerStappen(filterPad(res.stappen, pad));
    const alleStappen = hulpTekst
      ? [...stappenGetoond, { nr: stappenGetoond.length + 1, tekst: `<strong>${ui.laatChecken || ''}</strong> — ${hulpTekst}` }]
      : stappenGetoond;
    body = `<div class="resultaat-body">
      ${infoGetoond?`<div class="info-box" data-lees="">${infoGetoond}</div>`:''}
      <div class="sectie-label">${ui.volgendeStappen || ''}</div>
      <ul class="stap-lijst">${alleStappen.map(s=>`<li class="stap-item-res"><span class="stap-nr-res">${s.nr}</span><span class="stap-tekst-res">${s.tekst}</span></li>`).join('')}</ul>
      ${knoppen}${disclaimer}</div>`;
  } else if (res.type === 'eu') {
    const infoBoxenGetoond = filterPad(res.infoBoxen, pad);
    const stappenGetoond = hernummerStappen(filterPad(res.stappen, pad));
    let infoH = infoBoxenGetoond.map(b=>`<div class="${b.type==='amber'?'amber-box':'info-box'}" data-lees="">${b.tekst}</div>`).join('');
    let stappenH = res.stappen ? `<div class="sectie-label">${ui.watKunJeDoen || ''}</div><ul class="stap-lijst">${stappenGetoond.map(s=>`<li class="stap-item-res"><span class="stap-nr-res">${s.nr}</span><span class="stap-tekst-res">${s.tekst}</span></li>`).join('')}</ul>` : '';
    body = `<div class="resultaat-body">${infoH}${stappenH}${knoppen}${disclaimer}</div>`;
  } else if (res.type === 'route') {
    const infoBoxenGetoond = filterPad(res.infoBoxen, pad);
    const stappenGetoond = hernummerStappen(filterPad(res.stappen, pad));
    let infoH = infoBoxenGetoond.map(b=>`<div class="${b.type==='amber'?'amber-box':'info-box'}" data-lees="">${b.tekst}</div>`).join('');
    if (infoGetoond) infoH += `<div class="info-box" data-lees="">${infoGetoond}</div>`;
    // N-6 paden-titel: res.padenTitel, terugval ui.driePaden.
    const padenTitel = res.padenTitel || ui.driePaden || '';
    let padenH = res.paden ? `<div class="sectie-label">${padenTitel}</div><div class="route-paden">${res.paden.map(p=>`<div class="route-pad" data-lees=""><div class="route-pad-header"><div class="route-pad-nr">${p.nr}</div><div class="route-pad-titel">${p.titel}</div></div><div class="route-pad-tekst">${p.tekst}</div></div>`).join('')}</div>` : '';
    let stappenH = res.stappen ? `<div class="sectie-label" style="margin-top:1rem;">${ui.watKunJeNuDoen || ''}</div><ul class="stap-lijst">${stappenGetoond.map(s=>`<li class="stap-item-res"><span class="stap-nr-res">${s.nr}</span><span class="stap-tekst-res">${s.tekst}</span></li>`).join('')}</ul>` : '';
    body = `<div class="resultaat-body">${infoH}${padenH}${stappenH}${knoppen}${disclaimer}</div>`;
  } else {
    const altGetoond = filterPad(res.alternatieven, pad);
    body = `<div class="resultaat-body"><div class="alternatief-grid">${altGetoond.map(a=>`<div class="alternatief-item" data-lees=""><div class="alternatief-naam">${a.naam}</div><div class="alternatief-tekst">${a.tekst}</div></div>`).join('')}</div>${vwnBox}${knoppen}${disclaimer}</div>`;
  }
  kaart.innerHTML = `<div class="resultaat-header" data-lees=""><div class="resultaat-icoon-groot">${res.icoon}</div><div class="resultaat-titel">${res.titel}</div><div class="resultaat-sub">${res.sub}</div></div>${body}`;
  document.getElementById('hoofd').appendChild(kaart);
}

function kiesAntwoord(vraagId, i) {
  const nat = getNATdata();
  if (!nat) return;
  const v = nat.vragen[vraagId], a = v.antwoorden[i];
  // Correctie 1, §3.1.1: pad opslaan in het geschiedenis-item.
  geschiedenis.push({ vraagId, vraagTekst: v.tekst, antwoordTekst: a.tekst, klasse: a.klasse, pad: a.pad || null });
  huidigVraagId = a.volgende;
  render();
}

function opnieuwBeginnen() {
  geschiedenis = []; huidigVraagId = 'v1';
  document.getElementById('voortgang').style.width = '0%';
  render(); window.scrollTo({ top: 0, behavior: 'smooth' });
}

// Navigeer van het ene resultaat naar een ander (bijv. naar EU-langdurig ingezetene)
function gaNaarResultaat(id) {
  huidigVraagId = id;
  render(); window.scrollTo({ top: 0, behavior: 'smooth' });
}

render();
updateHeader();
</script>
<div id="solidari-footer"></div>
<script src="i18n.js"></script>
<script src="spraak.js"></script>
<script src="components.js"></script>
</body>
