# Solidari backend — api.solidari.nl (PLAN-1 fase 1.5)
# certbot --nginx voegt het TLS-blok en de redirect toe (fase 4.2). Tot die tijd: alleen poort 80.
server {
    listen 80;
    listen [::]:80;
    server_name api.solidari.nl;

    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;

    # CORS doet Flask (flask_cors, Config.ALLOWED_ORIGINS) — hier NIET dubbel zetten.

    # Health: geen rate limit, geen AI
    location = /api/health {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        access_log off;
    }

    # Voorlezen (PLAN-4): ruimer, kleine body, nooit cachen
    location = /api/tts {
        limit_req zone=solidari_tts burst=10 nodelay;
        client_max_body_size 64k;
        proxy_read_timeout 40s;
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Cache-Control "no-store" always;
    }

    # Brief Begrijper en overige AI-routes
    location /api/ {
        limit_req zone=solidari_api burst=3 nodelay;
        client_max_body_size 6M;
        proxy_read_timeout 130s;
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
    }

    location / { return 404; }
}
